<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Clinical Research App</title>
</head>
<body>
    <h1>Приложение для клинических исследований</h1>

    {% if errors %}
        <div>
            <h3>Ошибки:</h3>
            <ul>
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    {% if success_message %}
        <div>
            <h3>Успех:</h3>
            <p>{{ success_message }}</p>
        </div>
    {% endif %}

    <form method="post">
        <div>
            <label for="user_id">ID пользователя:</label>
            <input
                type="number"
                id="user_id"
                name="user_id"
                value="{{ form_data.get('user_id', '') }}"
            >
        </div>

        <br>

        <div>
            <label for="trial">Исследование:</label>
            <select id="trial" name="trial">
                <option value="trial_1" {% if form_data.get('trial') == 'trial_1' %}selected{% endif %}>
                    Исследование 1
                </option>
                <option value="trial_2" {% if form_data.get('trial') == 'trial_2' %}selected{% endif %}>
                    Исследование 2
                </option>
                <option value="trial_3" {% if form_data.get('trial') == 'trial_3' %}selected{% endif %}>
                    Исследование 3
                </option>
            </select>
        </div>

        <br>

        <div>
            <label for="condition_score">Оценка самочувствия:</label>
            <input
                type="number"
                id="condition_score"
                name="condition_score"
                value="{{ form_data.get('condition_score', '') }}"
            >
        </div>

        <br>

        <div>
            <label for="med">Препарат:</label>
            <select id="med" name="med">
                <option value="Плацебо" {% if form_data.get('med') == 'Плацебо' %}selected{% endif %}>
                    Плацебо
                </option>
                <option value="Препарат A" {% if form_data.get('med') == 'Препарат A' %}selected{% endif %}>
                    Препарат A
                </option>
            </select>
        </div>

        <br>

        <button type="submit">Отправить</button>
    </form>
</body>
</html>
